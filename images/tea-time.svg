<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#f0fff4"/>
      <stop offset="100%" style="stop-color:#c8f7dc"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#bgG)" rx="24"/>

  <!-- Decorative leaves -->
  <text x="30"  y="70"  font-size="28" opacity="0.5">🌿</text>
  <text x="410" y="65"  font-size="24" opacity="0.45">🍃</text>
  <text x="45"  y="270" font-size="22" opacity="0.4">🌱</text>
  <text x="395" y="280" font-size="26" opacity="0.45">🌿</text>
  <text x="220" y="38"  font-size="18" opacity="0.4">☁️</text>

  <!-- Steam wisps -->
  <path d="M218 108 Q213 95 218 82 Q223 69 218 56" stroke="#88d8b0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M240 105 Q235 90 240 75 Q245 60 240 45" stroke="#88d8b0" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M262 108 Q267 95 262 82 Q257 69 262 56" stroke="#88d8b0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Cup body -->
  <path d="M195 120 L210 250 L270 250 L285 120 Z" fill="#ffffff" stroke="#a8e6cf" stroke-width="3" rx="5"/>
  <!-- Cup bottom -->
  <ellipse cx="240" cy="250" rx="32" ry="10" fill="#a8e6cf" opacity="0.8"/>
  <!-- Cup top opening -->
  <ellipse cx="240" cy="120" rx="48" ry="16" fill="#e8fff3" stroke="#a8e6cf" stroke-width="3"/>

  <!-- Tea liquid -->
  <ellipse cx="240" cy="140" rx="38" ry="11" fill="#7ecba3" opacity="0.6"/>

  <!-- Cup handle -->
  <path d="M285 155 Q320 155 320 185 Q320 215 285 215" stroke="#a8e6cf" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Heart decoration on cup -->
  <text x="227" y="200" font-size="28" fill="#ff8fa3" opacity="0.85">♥</text>

  <!-- Saucer -->
  <ellipse cx="240" cy="260" rx="65" ry="14" fill="#c8f0d8" stroke="#a8e6cf" stroke-width="2"/>

  <!-- Text -->
  <text x="240" y="300" text-anchor="middle" font-size="17" fill="#2e7d32" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">喝杯茶，慢下来享受一刻~ ☕</text>
</svg>
